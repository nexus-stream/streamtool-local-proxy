name: build-release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet (windows target)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/nexus-stream-proxy.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-stream-proxy-windows
          path: dist/nexus-stream-proxy.exe
